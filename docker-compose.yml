# Local mirror of the Render single-image deployment.
#
# `app` is built from the root Dockerfile (nginx + supervisord + FastAPI +
# Next.js in one container). It is the only service with a published port;
# the database is reachable only on the internal compose network.
#
# Bring it up with:
#   docker compose up --build
# Then browse to http://localhost:8080.
#
# Before the first start, copy .env.example to .env and set:
#   SECRET               required; generate with: openssl rand -hex 32
#   FIRST_ADMIN_EMAIL    } create the first administrator on startup (only
#   FIRST_ADMIN_PASSWORD } while no superuser exists); remove the password afterwards

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_pass
      POSTGRES_DB: blog_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public hCaptcha site key — must be a build arg because Next.js
        # bakes NEXT_PUBLIC_* values into the client bundle at build time.
        NEXT_PUBLIC_HCAPTCHA_SITE_KEY: ${NEXT_PUBLIC_HCAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # asyncpg-flavoured URL — the backend's URL normaliser also accepts
      # postgres:// / postgresql://, but the explicit driver removes any doubt.
      # sslmode=disable: the local postgres container does not serve SSL, and
      # the backend requires SSL when sslmode is absent (hosted default).
      DATABASE_URL: postgresql+asyncpg://blog_user:blog_pass@db:5432/blog_db?sslmode=disable
      # JWT signing secret. Required: set it in .env (compose refuses to start without it).
      SECRET: "${SECRET:?Set SECRET in .env (generate with: openssl rand -hex 32)}"
      # Same-origin in compose; nginx serves both backend and frontend on :8080.
      FRONTEND_URL: http://localhost:8080
      # Optional: when no superuser exists, create this administrator as a NEW
      # account on startup (an existing account is never promoted). Both required.
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      # hCaptcha — defaults keep registration open so `docker compose up`
      # works without hCaptcha credentials. Flip ENABLED=true and set
      # HCAPTCHA_SECRET to enforce captcha on /auth/register.
      HCAPTCHA_ENABLED: ${HCAPTCHA_ENABLED:-false}
      HCAPTCHA_SECRET: ${HCAPTCHA_SECRET:-}
      # Nginx inside the container listens on $PORT (default 8080).
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      # Persist logos / avatars across `docker compose down`.
      - uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  uploads:
