[project]
name = "blog"
version = "0.1.0"
description = "Self-hosted multi-author blogging platform built with FastAPI and PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "fastapi>=0.124.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.34.0",
]
